spring.application.name=JWT_springboot3
server.port=8005

# Database Configuration
# Default: H2 Database in-memory/file for reliable plug-and-play execution
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jwt_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# If you want to use MySQL as in slide 21, configure:
# spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=1234567@a$

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

## H2 Console (available at http://localhost:8005/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## JWT Configuration (Nimbus JOSE + JWT)
# 256-bit secret key for HMAC-SHA256
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in milliseconds (3600000 ms)
security.jwt.expiration-time=3600000
