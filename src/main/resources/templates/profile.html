<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Boot REST API with AJAX Example</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .profile-container {
            max-width: 600px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        #images {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0d6efd;
            margin: 20px 0;
        }
        #profile {
            font-size: 1.5rem;
            font-weight: 600;
            color: #212529;
            margin-bottom: 10px;
        }
        .token-box {
            background: #e9ecef;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container" style="min-height: 500px">
        <div class="profile-container">
            <h2 class="text-primary">Spring Boot REST API with AJAX Example</h2>
            <p class="text-muted">Xác thực Token thành công bằng Nimbus JOSE + JWT</p>
            
            <img id="images" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar">
            <div id="profile">Đang tải thông tin...</div>
            <div id="email-display" class="text-muted mb-3"></div>

            <div class="token-box">
                <strong>Current Token (Bearer in localStorage):</strong>
                <div id="token-display"></div>
            </div>

            <button id="logout" class="btn btn-outline-danger px-4">Logout</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>
